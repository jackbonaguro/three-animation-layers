<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - animation layers</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body {
				margin: 0;
				overflow: hidden;
				font-family: Monospace, monospace;
				font-size: 13px;
				line-height: 24px;
			}
			a {
				color: #f00;
			}
			#info {
				position: absolute;
				top: 0;
				width: 100%;
				padding: 10px;
				box-sizing: border-box;
				text-align: center;
				user-select: none;
				pointer-events: none;
				z-index: 1;
			}
			#error {
				position: absolute;
				left: 50%;
				top: 50%;
				transform: translate(-50%, -50%);
				max-width: 32em;
				padding: 1em 1.25em;
				background: #422;
				color: #fff;
				border-radius: 6px;
				font-family: system-ui, sans-serif;
				font-size: 14px;
				line-height: 1.45;
				z-index: 2;
			}
		</style>
	</head>
	<body>
		<div id="container"></div>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
			— layered animation mixer (base idle/run + masked upper-body punch).<br/>
			Animations from <a href="https://www.mixamo.com/" target="_blank" rel="noopener">mixamo.com</a>
			— hold <strong>W</strong> to run, <strong>Space</strong> to punch.<br/>
			Place <code>character.fbx</code> beside this page or edit the loader URL in the script below.
		</div>
		<div id="error" hidden></div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">
			import * as THREE from 'three';
			import Stats from 'three/addons/libs/stats.module.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import AnimationPlayer from './js/AnimationPlayer.js';

			const FBX_URL = './character.fbx';

			let camera, scene, renderer, controls, clock, stats;
			let player;
			let runKeyboard = false;

			const settings = {
				'show model': true,
				'show skeleton': true,
				playback: 'Idle',
				'trigger punch': function () {

					player?.triggerPunch();

				},
				'idle weight': 0,
				'run weight': 0,
				'punch weight': 0,
				'mixer time scale': 1.0,
			};

			init();

			function createPanel() {

				const panel = new GUI( { width: 310 } );

				const folder1 = panel.addFolder( 'Visibility' );
				const folder2 = panel.addFolder( 'Playback' );
				const folder3 = panel.addFolder( 'Effective weights' );
				const folder4 = panel.addFolder( 'Mixer' );

				folder1.add( settings, 'show model' ).onChange( function ( v ) {

					if ( player ) player.rig.visible = v;

				} );
				folder1.add( settings, 'show skeleton' ).onChange( function ( v ) {

					if ( player?.skeletonHelper ) player.skeletonHelper.visible = v;

				} );

				folder2
					.add( settings, 'playback', [ 'Idle', 'Running' ] )
					.name( 'base layer' )
					.onChange( function () {

						applyRunState();

					} );
				folder2.add( settings, 'trigger punch' );

				folder3.add( settings, 'idle weight', 0, 1, 0.01 ).listen().disable();
				folder3.add( settings, 'run weight', 0, 1, 0.01 ).listen().disable();
				folder3.add( settings, 'punch weight', 0, 1, 0.01 ).listen().disable();

				folder4.add( settings, 'mixer time scale', 0, 1.5, 0.01 ).onChange( function ( v ) {

					if ( player ) player.mixer.timeScale = v;

				} );

				folder1.open();
				folder2.open();
				folder3.open();
				folder4.open();

			}

			function showLoadError( err ) {

				console.error( err );
				const msg = document.getElementById( 'error' );
				if ( msg ) {

					msg.hidden = false;
					msg.textContent =
						'Could not load ' + FBX_URL + '. Place your Mixamo FBX next to this page (Idle, Running, Punch_1) or change FBX_URL in example.html.';

				}

			}

			function applyRunState() {

				const held = runKeyboard || settings.playback === 'Running';
				player?.setRunningHeld( held );

			}

			async function init() {

				const container = document.getElementById( 'container' );

				clock = new THREE.Clock();

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xdddddd );

				camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );
				camera.position.set( 0, 10, 50 );

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				container.appendChild( renderer.domElement );

				stats = new Stats();
				container.appendChild( stats.dom );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.update();

				const ambientLight = new THREE.AmbientLight( 0xffffff, 1 );
				scene.add( ambientLight );

				const directionalLight = new THREE.DirectionalLight( 0xffffff, 2 );
				directionalLight.position.set( 100, 200, 100 );
				directionalLight.castShadow = true;
				scene.add( directionalLight );

				createPanel();

				try {

					player = await AnimationPlayer.loadFromFbx( FBX_URL, 0.05 );
					player.addToScene( scene );
					if ( player.skeletonHelper ) player.skeletonHelper.visible = settings[ 'show skeleton' ];

				} catch ( err ) {

					showLoadError( err );

				}

				window.addEventListener( 'resize', onWindowResize );
				window.addEventListener( 'keydown', onKeyDown );
				window.addEventListener( 'keyup', onKeyUp );

				renderer.setAnimationLoop( animate );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function onKeyDown( ev ) {

				const t = ev.target;
				if ( t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement ) return;

				if ( ev.code === 'Space' ) {

					if ( ev.repeat ) return;
					ev.preventDefault();
					player?.triggerPunch();
					return;

				}

				if ( ev.key === 'w' || ev.key === 'W' ) {

					if ( ev.repeat ) return;
					runKeyboard = true;
					applyRunState();

				}

			}

			function onKeyUp( ev ) {

				const t = ev.target;
				if ( t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement ) return;

				if ( ev.key === 'w' || ev.key === 'W' ) {

					runKeyboard = false;
					applyRunState();

				}

			}

			function updateWeightDisplay() {

				if ( ! player ) return;
				settings[ 'idle weight' ] = player.idleAction
					? player.idleAction.getEffectiveWeight()
					: 0;
				settings[ 'run weight' ] = player.runningAction
					? player.runningAction.getEffectiveWeight()
					: 0;
				settings[ 'punch weight' ] = player.punchAction
					? player.punchAction.getEffectiveWeight()
					: 0;

			}

			function animate() {

				const delta = clock.getDelta();

				player?.update( delta );
				updateWeightDisplay();

				controls.update();
				renderer.render( scene, camera );
				stats.update();

			}

		</script>
	</body>
</html>
